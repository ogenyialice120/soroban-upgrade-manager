name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test, Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (native)
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Build (wasm)
        run: cargo build --target wasm32v1-none --release --manifest-path contracts/upgrade-manager/Cargo.toml

      - name: Verify claims audit
        run: bash scripts/check_claims.sh

      - name: Verify committed fixtures match SHA256SUMS
        run: |
          cd contracts/upgrade-manager/tests/fixtures && sha256sum -c SHA256SUMS

