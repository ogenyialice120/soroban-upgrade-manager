name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test, Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (native)
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Build (wasm)
        run: cargo build --target wasm32-unknown-unknown --release --manifest-path contracts/upgrade-manager/Cargo.toml

      - name: Verify claims audit
        run: bash scripts/check_claims.sh

      - name: Rebuild fixtures and verify drift
        run: |
          bash scripts/build_fixtures.sh
          cd contracts/upgrade-manager/tests/fixtures
          if ! git diff --quiet -- target_v1.wasm target_v2.wasm SHA256SUMS; then
            echo "ERROR: Committed fixtures differ from rebuilt fixtures."
            echo "Run 'bash scripts/build_fixtures.sh' and commit the result."
            git diff -- target_v1.wasm target_v2.wasm SHA256SUMS
            exit 1
          fi

