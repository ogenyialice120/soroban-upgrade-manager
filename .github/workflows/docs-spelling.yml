name: Documentation spelling
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  docs-spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown spelling
        uses: crate-ci/typos@v1
        with:
          files: README.md CONTRIBUTING.md SECURITY.md _CHANGELOG.md docs
          config: typos.toml
