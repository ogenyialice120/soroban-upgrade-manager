name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build upgrade-manager WASM (release)
        run: cargo build --target wasm32-unknown-unknown --release --manifest-path contracts/upgrade-manager/Cargo.toml

      - name: Compute SHA-256
        id: sha
        run: |
          WASM_FILE="target/wasm32-unknown-unknown/release/soroban_upgrade_manager.wasm"
          SHA256=$(sha256sum "$WASM_FILE" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA256"
          # Write the .sha256 file next to the .wasm and attach it too.
          echo "$SHA256" > "$WASM_FILE.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/wasm32-unknown-unknown/release/soroban_upgrade_manager.wasm
            target/wasm32-unknown-unknown/release/soroban_upgrade_manager.wasm.sha256
          body: |
            ## Soroban Upgrade Manager — ${{ github.ref_name }}

            ### Build artifact

            - **WASM**: `soroban_upgrade_manager.wasm`
            - **SHA-256**: `${{ steps.sha.outputs.sha256 }}`

            ### Verification

            ```bash
            sha256sum soroban_upgrade_manager.wasm
            # Should match: ${{ steps.sha.outputs.sha256 }}
            ```

            Deploy with:
            ```bash
            stellar contract deploy \
              --wasm soroban_upgrade_manager.wasm \
              --source <ADMIN_KEY> \
              --network <NETWORK>
            ```

            See [README.md](https://github.com/ogenyialice120/soroban-upgrade-manager/blob/${{ github.ref_name }}/README.md) for full usage instructions.
