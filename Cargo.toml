[workspace]
resolver = "2"
members = ["contracts/upgrade-manager", "contracts/example-target"]

[workspace.package]
rust-version = "1.88.0"

[workspace.dependencies]
soroban-sdk = { version = "22.0.11", features = [] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
