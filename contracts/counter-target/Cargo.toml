[package]
name = "counter-target"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Minimal counter target contract used as a second example target for the Soroban Upgrade Manager upgrade pattern."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { version = "22.0.11", features = ["testutils"] }

[features]
# Build with `--features v2` to get a contract whose `increment` adds 2 instead of 1.
v2 = []
testutils = ["soroban-sdk/testutils"]