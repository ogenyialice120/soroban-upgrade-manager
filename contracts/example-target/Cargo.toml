[package]
name = "example-target"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Minimal upgradable contract used as example target for soroban-upgrade-manager tests."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { version = "22.0.11", features = ["testutils"] }

[features]
# Build with `--features v2` to get a contract whose version() returns 2.
v2 = []
testutils = ["soroban-sdk/testutils"]
