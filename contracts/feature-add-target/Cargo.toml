[package]
name = "feature-add-target"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Example target showing an upgrade that adds a new function (get_description) in v2."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { version = "22.0.11", features = ["testutils"] }

[features]
# Build with `--features v2` to get a contract that adds get_description().
v2 = []
testutils = ["soroban-sdk/testutils"]