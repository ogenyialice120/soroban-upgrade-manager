[package]
name = "soroban-upgrade-manager"
version = "0.1.0"
edition = "2021"
authors = ["ogenyialice120"]
description = "A Soroban smart contract that manages WASM upgrades for other contracts via governance votes and a configurable timelock delay."
license = "MIT"
repository = "https://github.com/ogenyialice120/soroban-upgrade-manager"
keywords = ["stellar", "soroban", "governance", "upgrade", "timelock"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { version = "22.0.11", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
